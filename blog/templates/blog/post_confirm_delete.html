{% extends 'blog/base.html' %}

{% block content %}
    <div class="alert alert-danger my-4" role="alert">

        <h1 class="alert-heading">Deleting Post!</h1>
        <p>Are you really sure you want to delete "<strong>{{ post.title }}</strong>"? This action cannot be undone.This will delete the post from the database permanently.</p>
        
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Confirm Delete</button>
        </form>
        
        <a href="{% url 'blog:post_detail' slug=post.slug %}" class="btn btn-secondary">Cancel. I changed my mind!</a>
    </div>
{% endblock %}
