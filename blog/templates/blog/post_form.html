{% extends 'blog/base.html' %}

{% block title  %}{% if post %}Edit Post{% else %}Create New Blog Post{% endif %} - My Blog{% endblock %}

{% block content %}
    <h1>{% if post %}Edit Post {% else %}Create a New Blog Post{% endif %}</h1>

    <form method="POST" class="my-4">
        {% csrf_token %}

        {{ form.as_p }}
        
        <button type="submit" class="btn btn-success">Save Post</button>
    </form>

    <a href="{% url 'blog:home' %}">Cancel</a>
{% endblock %}
