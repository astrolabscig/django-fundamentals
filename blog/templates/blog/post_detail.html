{% extends 'blog/base.html' %}

{% block title  %}{{ post.title }} - My Blog{% endblock %}

{% block content %}
    <span class="category-badge category-badge--teal">
        {{ post.category }}
    </span>
    <h1 class="post-title">{{ post.title  }} </h1>
    <p class="post-meta mb-4">
        {{ post.created_at|date:"N j, Y" }} - {{ post.author }}
    </p>
    <a href="{% url 'blog:update_post' slug=post.slug %}" class="btn btn-outline-primary btn-sm">Edit Post</a>
    <a href="{% url 'blog:delete_post' slug=post.slug %}" class="btn btn-outline-danger btn-sm">Delete</a>
    <div class="post-body">{{ post.body }}</div>
    <a href="{% url 'blog:home' %}">Back to Home</a>
{% endblock %}
